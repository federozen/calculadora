name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and dev tools
        run: python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      - name: Ruff
        run: python -m ruff check --select F,E9 *.py tests/*.py tools/*.py

      - name: Release guard
        run: python tools/release.py check
