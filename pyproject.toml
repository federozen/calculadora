[project]
name = "calculadora-futbol-argentino"
version = "3.8.36"
description = "Calculadora editorial de escenarios de la LPF 2026 (Streamlit)."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "streamlit>=1.36",
    "pandas>=2.0",
    "numpy>=1.26",
    "requests>=2.31",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    "html5lib>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
# La app monolítica se limpia de forma incremental; por ahora se controla
# la categoría F (nombres indefinidos, imports y variables sin uso) en los
# módulos nuevos y de soporte.
[tool.ruff.lint]
select = ["F", "E9"]
